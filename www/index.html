/* ── DESIGN TOKENS ── */
:root {
  --bg:        #0a0e0b;
  --bg2:       #0f1610;
  --card:      #131a14;
  --card2:     #192019;
  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(34,197,94,0.18);
  --text:      #e8f0e9;
  --text2:     #7a9b7d;
  --text3:     #4a6b4d;
  --green:     #22c55e;
  --green2:    #16a34a;
  --green3:    #052e16;
  --gold:      #f59e0b;
  --gold2:     #d97706;
  --emerald:   #10b981;
  --purple:    #8b5cf6;
  --radius:    16px;
  --nav-h:     72px;
  --hero-bg:   linear-gradient(160deg,#0a1a0c 0%,#0f2012 50%,#0a1a0c 100%);
  --awards-bg: linear-gradient(160deg,#1a1200 0%,#1f1600 50%,#1a1200 100%);
  --safe-top:  max(12px, env(safe-area-inset-top));
}
.light {
  --bg:        #f0f7f1;
  --bg2:       #e4f0e5;
  --card:      #ffffff;
  --card2:     #f5faf5;
  --border:    rgba(0,0,0,0.07);
  --border2:   rgba(34,197,94,0.25);
  --text:      #0f1f10;
  --text2:     #3d6b42;
  --text3:     #7aaa7e;
  --green3:    #dcfce7;
  --hero-bg:   linear-gradient(160deg,#e8f5ea 0%,#d4ecd8 50%,#e8f5ea 100%);
  --awards-bg: linear-gradient(160deg,#fef9ee 0%,#fdf3dc 50%,#fef9ee 100%);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100svh}
.ar{font-family:'Noto Naskh Arabic',Georgia,serif;direction:rtl}
#root{min-height:100svh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;overflow:hidden}
input,button,select{font-family:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:2px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── GEO PATTERN ── */

/* ── ANIMATIONS ── */
@keyframes shimmer{0%{background-position:-300% center}100%{background-position:300% center}}
.shimmer{background:linear-gradient(90deg,#f59e0b,#fde68a,#22c55e,#fde68a,#f59e0b);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 5s linear infinite}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .4s ease-out forwards}

@keyframes scaleIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.scale-in{animation:scaleIn .35s cubic-bezier(.34,1.56,.64,1) forwards}

@keyframes checkPop{0%{transform:scale(0) rotate(-20deg)}65%{transform:scale(1.25) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
.check-pop{animation:checkPop .32s cubic-bezier(.34,1.56,.64,1) forwards}

@keyframes streakPulse{0%{box-shadow:0 0 0 0 rgba(245,158,11,.5)}70%{box-shadow:0 0 0 9px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.streak-pulse{animation:streakPulse 2.2s ease-out infinite}

@keyframes confBurst{0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(0);opacity:0}}
.conf-p{position:fixed;width:7px;height:7px;border-radius:2px;animation:confBurst 1.3s ease-out forwards;pointer-events:none;z-index:9999}

@keyframes celebrateIn{0%{opacity:0;transform:scale(.7) translateY(20px)}70%{transform:scale(1.04) translateY(-4px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.celebrate-in{animation:celebrateIn .5s cubic-bezier(.34,1.56,.64,1) forwards}

@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

@keyframes badgeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ── GLASS CARD ── */
.glass{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(20px)}
.glass2{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius)}

/* ── TASK CARD ── */
.task-card{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:14px;border:1px solid var(--border);background:var(--card);margin-bottom:7px;cursor:pointer;transition:all .22s ease;position:relative;overflow:hidden}
.task-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px 0 0 2px;background:transparent;transition:background .3s}
.task-card:hover{border-color:rgba(34,197,94,.2);transform:translateX(2px)}
.task-card.done{background:rgba(34,197,94,.06);border-color:rgba(34,197,94,.2)}
.task-card.done::before{background:linear-gradient(to bottom,#22c55e,#10b981)}

/* ── CHECKBOX ── */
.cb{width:23px;height:23px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .28s ease}
.cb.done{background:#22c55e;border-color:#22c55e;box-shadow:0 0 12px rgba(34,197,94,.45)}

/* ── GROUP HEADER ── */
.group-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 6px;cursor:pointer;user-select:none}

/* ── PILL BADGE ── */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.02em}

/* ── NAV ── */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:50;
     background:rgba(10,14,11,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
     border-top:1px solid var(--border)}
.light .nav{background:rgba(240,247,241,.9)}
.nav-inner{display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 12px;border-radius:12px;border:none;cursor:pointer;background:transparent;color:var(--text3);transition:all .2s;position:relative}
.nav-btn.active{color:var(--green)}
.nav-pill{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:2px;background:var(--green);box-shadow:0 0 8px rgba(34,197,94,.6)}

/* ── RING SVG ── */
.ring-arc{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1)}

/* ── PROGRESS BAR ── */
.pbar-wrap{height:5px;background:var(--card2);border-radius:3px;overflow:hidden}
.pbar-fill{height:100%;border-radius:3px;transition:width .9s cubic-bezier(.4,0,.2,1)}

/* ── WEEKLY DOTS ── */
.wdot{flex:1;height:6px;border-radius:3px;transition:background .4s}

/* ── FILTER CHIP ── */
.chip{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid var(--border);font-size:11px;font-weight:600;cursor:pointer;transition:all .18s;background:transparent;color:var(--text2);white-space:nowrap}
.chip.on{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.35);color:var(--green)}
.chip.amber{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.3);color:var(--gold)}

/* ── SEARCH ── */
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap input{width:100%;padding:9px 12px 9px 36px;font-size:13px;background:var(--card2);border:1px solid var(--border);border-radius:12px;outline:none;color:var(--text);transition:border-color .2s}
.search-wrap input:focus{border-color:var(--border2)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3)}

/* ── BADGE CARD ── */
.badge-card{display:flex;flex-direction:column;align-items:center;gap:7px;padding:18px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card);transition:all .3s;text-align:center}
.badge-card.earned{border-color:rgba(245,158,11,.3)}
.badge-card.locked{opacity:.38;filter:grayscale(.7)}

/* ── TOGGLE SWITCH ── */
.toggle-track{width:46px;height:26px;border-radius:13px;position:relative;transition:background .3s;cursor:pointer;flex-shrink:0}
.toggle-knob{position:absolute;top:3px;width:20px;height:20px;background:#fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,.35);transition:left .28s cubic-bezier(.34,1.56,.64,1)}

/* ── OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-card{background:var(--card);border:1px solid var(--border2);border-radius:24px;padding:28px 24px;text-align:center;max-width:300px;width:100%}

/* ── SECTION TITLE ── */
.sec-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}

/* ── SCREEN TRANSITIONS ── */
.screen-enter{animation:fadeUp .35s ease-out forwards}
@keyframes tabSlide{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
.tab-enter{animation:tabSlide .28s ease-out forwards}

/* ── FAB / CTA ── */
.cta-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:14px;border:none;font-size:14px;font-weight:700;color:#052e16;background:linear-gradient(135deg,#22c55e,#10b981);box-shadow:0 4px 20px rgba(34,197,94,.35);transition:transform .2s,box-shadow .2s}
.cta-btn:active{transform:scale(.98)}
.cta-btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);box-shadow:none}

/* ── NAV BADGE ── */
.nav-badge{position:absolute;top:-4px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--gold);color:#1a1200;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 0 2px var(--bg)}

/* ── CHIP ROW ── */
.chip-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip-row .chip{scroll-snap-align:start}

/* ── PROGRESS TABS ── */
.ptabs{display:flex;gap:6px;padding:4px;background:var(--card2);border-radius:12px;margin-bottom:16px;border:1px solid var(--border)}
.ptab{flex:1;padding:9px 6px;border-radius:9px;border:none;font-size:11px;font-weight:700;color:var(--text3);background:transparent;transition:all .2s}
.ptab.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.12)}

/* ── SEARCH CLEAR ── */
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;border:none;background:var(--card);color:var(--text3);display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1}

/* ── MODAL CLOSE ── */
.modal-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--card2);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:18px}

/* ── TASK CARD TOUCH ── */
.task-card{min-height:52px}
.task-card:active{transform:scale(.99)}
.cb{width:26px;height:26px}

/* ── SKIP LINK ── */
.skip-link{position:absolute;left:-9999px;top:auto}
.skip-link:focus{left:16px;top:var(--safe-top);z-index:200;padding:8px 12px;background:var(--green);color:#052e16;border-radius:8px;font-weight:700}
</style>
</head>

const TODAY=new Date().toISOString().split('T')[0];
const THIS_MONTH=`${new Date().getFullYear()}-${new Date().getMonth()}`;
function weekKey(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d.toISOString().split('T')[0]}
function calcStreak(h){
  if(!h||!h.length)return 0;
  const s=[...new Set(h)].sort().reverse();
  let streak=0,cur=new Date(TODAY);
  for(const dt of s){const d=new Date(dt);const diff=Math.round((cur-d)/864e5);if(diff<=1){streak++;cur=d;}else break;}
  return streak;
}
function defState(){return{daily:[],weekly:{},monthly:[],lifetime:[],streak:0,streakHist:[],fullHist:[],badges:[],notifs:[],theme:'dark',lastDay:TODAY,lastWeek:weekKey(),lastMonth:THIS_MONTH}}
function loadState(){
  try{
    const raw=localStorage.getItem('na-v3');
    const def=defState();
    if(!raw)return def;
    const s=JSON.parse(raw);
    if(s.lastDay!==TODAY){s.daily=[];s.lastDay=TODAY;}
    if(s.lastWeek!==weekKey()){s.weekly={};s.lastWeek=weekKey();}
    if(s.lastMonth!==THIS_MONTH){s.monthly=[];s.lastMonth=THIS_MONTH;}
    s.streak=calcStreak(s.streakHist||[]);
    return{...def,...s};
  }catch{return defState();}
}
function checkBadges(s){
  const e=[...s.badges];
  const add=id=>{if(!e.includes(id))e.push(id);};
  if(s.daily.length>0)add('first');
  if(s.daily.length===56)add('daily_all');
  if(s.monthly.length===4)add('monthly_all');
  if(s.lifetime.includes('l71'))add('scholar');
  if(s.streak>=7)add('streak7');
  if(s.streak>=30)add('streak30');
  if(s.streak>=90)add('streak90');
  if(s.streak>=365)add('streak365');
  if((s.fullHist||[]).length>=7)add('perfect_week');
  if(WEEKLY.filter(t=>(s.weekly[t.id]||0)>=5).length===12)add('weekly_all');
  return e;
}

/* ══════════════════════════════════════════════════════
   CONFETTI
══════════════════════════════════════════════════════ */
function Confetti({show}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!show||!ref.current)return;
    const cols=['#22c55e','#f59e0b','#10b981','#fbbf24','#34d399','#86efac','#fde68a'];
    const frags=[];
    for(let i=0;i<32;i++){
      const el=document.createElement('div');
      el.className='conf-p';
      const ang=(i/32)*360,dist=80+Math.random()*100;
      el.style.cssText=`left:50%;top:38%;background:${cols[i%cols.length]};--tx:${Math.cos(ang*Math.PI/180)*dist}px;--ty:${Math.sin(ang*Math.PI/180)*dist-60}px;--rot:${Math.random()*720-360}deg;animation-delay:${Math.random()*0.18}s;width:${4+Math.random()*8}px;height:${4+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'3px'}`;
      ref.current.appendChild(el);frags.push(el);
    }
    const t=setTimeout(()=>frags.forEach(f=>f.remove()),2e3);
    return()=>{clearTimeout(t);frags.forEach(f=>f.remove());};
  },[show]);
  return h('div',{ref,style:{position:'fixed',inset:0,pointerEvents:'none',zIndex:9999}});
}

/* ══════════════════════════════════════════════════════
   DAILY SCREEN
══════════════════════════════════════════════════════ */
const GROUP_ORDER=['Salah','Quran','Dhikr','Character','Sunnah','Dawah','Knowledge','Org','Tawbah','Self-Check','Intentions'];

function DailyScreen({state,onToggle,onNotif}){
  const[search,setSearch]=useState('');
  const[grp,setGrp]=useState('All');
  const[pendingOnly,setPending]=useState(false);
  const[expandAll,setExpandAll]=useState(null);
  const done=state.daily;
  const pct=Math.round(done.length/56*100);
  const pending=56-done.length;
  const firstIncomplete=useMemo(()=>{
    for(const g of GROUP_ORDER){
      const tasks=DAILY.filter(t=>t.g===g);
      if(tasks.some(t=>!done.includes(t.id)))return g;
    }
    return null;
  },[done]);

  const grouped=useMemo(()=>{
    const map={};
    DAILY.forEach(t=>{if(!map[t.g])map[t.g]=[];map[t.g].push(t);});
    return GROUP_ORDER.filter(g=>map[g]).map(g=>({g,tasks:map[g]}));
  },[]);

  const visGroups=useMemo(()=>{
    return grouped.map(({g,tasks})=>({
      g,tasks:tasks.filter(t=>{
        const mg=grp==='All'||g===grp;
        const ms=!search||t.text.toLowerCase().includes(search.toLowerCase());
        const mp=!pendingOnly||!done.includes(t.id);
        return mg&&ms&&mp;
      })
    })).filter(({tasks})=>tasks.length>0);
  },[grouped,grp,search,pendingOnly,done]);

  return h('div',{className:'tab-enter',style:{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}},
    /* sticky header */
    h('div',{style:{padding:'calc(12px + var(--safe-top)) 16px 12px',background:'var(--bg)',borderBottom:'1px solid var(--border)',flexShrink:0}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:10}},
        h('div',{},
          h('h2',{style:{fontSize:20,fontWeight:800,letterSpacing:'-.3px'}},'Daily Deeds'),
          h('p',{style:{fontSize:11,color:'var(--text3)',marginTop:1}},done.length+' of 56 · '+pending+' left')),
        h('div',{style:{textAlign:'right'}},
          h('div',{style:{fontSize:28,fontWeight:900,color:'var(--green)',lineHeight:1}},pct+'%'),
          h('div',{style:{fontSize:10,color:'var(--text3)'}},pct===100?'🎉 Complete!':'in progress'))),
      h('div',{className:'pbar-wrap',style:{height:6,borderRadius:3,marginBottom:12}},
        h('div',{className:'pbar-fill',style:{width:pct+'%',background:'linear-gradient(90deg,#22c55e,#10b981)',boxShadow:'0 0 8px rgba(34,197,94,.45)'}})),
      h('div',{className:'search-wrap'},
        h('span',{className:'search-icon'},h(I.Search)),
        h('input',{value:search,onChange:e=>setSearch(e.target.value),placeholder:'Search tasks…','aria-label':'Search daily tasks'}),
        search&&h('button',{type:'button',className:'search-clear',onClick:()=>setSearch(''),'aria-label':'Clear search'},'×')),
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:8}},
        h('div',{className:'chip-row',style:{flex:1}},
          h('button',{type:'button',className:'chip'+(pendingOnly?' amber':''),onClick:()=>setPending(p=>!p),style:{display:'flex',alignItems:'center',gap:4}},
            h(I.Filter),' Pending ('+pending+')'),
          ['All',...GROUP_ORDER].map(g=>h('button',{key:g,type:'button',className:'chip'+(grp===g?' on':''),onClick:()=>setGrp(g)},g))),
        h('div',{style:{display:'flex',gap:4,flexShrink:0}},
          h('button',{type:'button',className:'chip',onClick:()=>setExpandAll(true),title:'Expand all'},'＋'),
          h('button',{type:'button',className:'chip',onClick:()=>setExpandAll(false),title:'Collapse all'},'－')))),

    h('div',{style:{flex:1,overflowY:'auto',padding:'12px 16px',paddingBottom:'var(--nav-h)'}},
      visGroups.length===0
        ? h('div',{style:{textAlign:'center',padding:'60px 0',color:'var(--text3)'}},
            h('div',{style:{fontSize:44,marginBottom:10}},'✅'),
            h('p',{style:{fontSize:14,fontWeight:600}},'All caught up!'),
            h('p',{style:{fontSize:12,marginTop:4}},pendingOnly?'No pending tasks here 🎉':'No tasks found'))
        : visGroups.map(({g,tasks})=>h(TaskGroup,{key:g,name:g,tasks,done:state.daily,notifs:state.notifs,onToggle,onNotif,showNotif:true,
          defaultOpen:expandAll===true||(expandAll!==false&&(g===firstIncomplete||(!firstIncomplete&&g===GROUP_ORDER[0])))}))));
}

    h('p',{className:'sec-title'},'Appearance'),
    h('div',{style:{background:'var(--card)',border:'1px solid var(--border)',borderRadius:14,marginBottom:20,overflow:'hidden'}},
      h('button',{onClick:onTheme,style:{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px',background:'transparent',border:'none',cursor:'pointer',color:'var(--text)'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:10}},
          state.theme==='dark'?h(I.Moon):h(I.SunSmall),
          h('div',{style:{textAlign:'left'}},
            h('p',{style:{fontSize:13,fontWeight:700}},state.theme==='dark'?'Dark Mode':'Light Mode'),
            h('p',{style:{fontSize:11,color:'var(--text3)'}},state.theme==='dark'?'Switch to light theme':'Switch to dark theme'))),
        h('div',{className:'toggle-track',style:{background:state.theme==='dark'?'#3b82f6':'var(--gold)'}},
          h('div',{className:'toggle-knob',style:{left:state.theme==='dark'?'23px':'3px'}})))),

    /* Stats */
    h('p',{className:'sec-title'},'Your Stats'),
    h('div',{style:{background:'var(--card)',border:'1px solid var(--border)',borderRadius:14,padding:'16px',marginBottom:20}},
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}},
        [{e:'🔥',v:state.streak,l:'Streak',c:'var(--gold)'},{e:'✅',v:state.daily.length,l:'Today',c:'var(--green)'},{e:'🏅',v:state.badges.length,l:'Badges',c:'#10b981'}]
          .map(({e,v,l,c})=>h('div',{key:l,style:{textAlign:'center'}},
            h('div',{style:{fontSize:20,marginBottom:2}},e),
            h('div',{style:{fontSize:20,fontWeight:800,color:c}},v),
            h('div',{style:{fontSize:10,color:'var(--text3)',textTransform:'uppercase',fontWeight:600,letterSpacing:'.05em'}},l))))),

    /* Notifications */
    h('p',{className:'sec-title'},'Notifications by Category'),
    h('div',{style:{background:'var(--card)',border:'1px solid var(--border)',borderRadius:14,overflow:'hidden',marginBottom:20}},
      Object.entries(byG).map(([g,tasks],i)=>{
        const allOn=tasks.every(t=>state.notifs.includes(t.id));
        const someOn=tasks.some(t=>state.notifs.includes(t.id));
        const nCount=tasks.filter(t=>state.notifs.includes(t.id)).length;
        return h('div',{key:g,style:{display:'flex',alignItems:'center',justifyContent:'space-between',
          padding:'13px 16px',borderTop:i>0?'1px solid var(--border)':'none'}},
          h('div',{},
            h('p',{style:{fontSize:13,fontWeight:700}},g),
            h('p',{style:{fontSize:11,color:'var(--text3)'}},tasks.length+' tasks · '+nCount+' notified')),
          h('button',{onClick:()=>{const t2=byG[g];const on=t2.every(t=>state.notifs.includes(t.id));t2.forEach(t=>{const isOn=state.notifs.includes(t.id);if(on?isOn:!isOn)onNotif(t.id);});},
            style:{padding:'7px 9px',borderRadius:10,border:'none',cursor:'pointer',transition:'all .2s',
              background:allOn?'rgba(34,197,94,.15)':someOn?'rgba(245,158,11,.1)':'transparent',
              color:allOn?'var(--green)':someOn?'var(--gold)':'var(--text3)'}},
            allOn?h(I.Bell,{s:15}):h(I.BellOff,{s:15})));
      })),

    /* About */
    h('p',{className:'sec-title'},'About'),
    h('div',{style:{background:'var(--card)',border:'1px solid var(--border)',borderRadius:14,padding:'16px',marginBottom:16}},
      h('div',{style:{display:'flex',alignItems:'center',gap:12,marginBottom:12}},
        h('div',{style:{width:44,height:44,borderRadius:12,background:'rgba(34,197,94,.12)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}},'☪️'),
        h('div',{},
          h('p',{style:{fontSize:14,fontWeight:800}},'Neik-Amal'),
          h('p',{style:{fontSize:11,color:'var(--text3)'}},'نیک عمل · Pious Deeds Tracker'))),
      h('p',{style:{fontSize:12,color:'var(--text3)',lineHeight:1.7}},
        'Based on the 56 daily Madani tasks, weekly goals, monthly objectives and lifetime achievements from the Madani environment of Dawat-e-Islami.'),
      h('p',{className:'ar',style:{fontSize:14,color:'var(--text3)',marginTop:12,textAlign:'right'}},'بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ')),
    h('p',{style:{textAlign:'center',fontSize:11,color:'var(--text3)',lineHeight:1.7}},'Data stored locally on your device\nMay Allah ﷻ accept your deeds. آمِينَ'));
}

/* ══════════════════════════════════════════════════════
   BOTTOM NAV
══════════════════════════════════════════════════════ */
const TABS=[
  {id:'home',label:'Home',Icon:I.Home},
  {id:'daily',label:'Daily',Icon:I.Sun},
  {id:'progress',label:'Progress',Icon:I.Chart},
  {id:'awards',label:'Awards',Icon:I.Trophy},
  {id:'settings',label:'Settings',Icon:I.Cog},
];

/* ══════════════════════════════════════════════════════
   APP
══════════════════════════════════════════════════════ */
function App(){
  const[state,setState]=useState(loadState);
  const[tab,setTab]=useState('home');
  const[celebrate,setCelebrate]=useState(false);
  const prevCount=useRef(state.daily.length);

  /* theme */
  useEffect(()=>{
    document.documentElement.classList.toggle('light',state.theme==='light');
    localStorage.setItem('na-v3',JSON.stringify(state));
  },[state]);

  /* celebrate on full completion */
  useEffect(()=>{
    if(state.daily.length===56&&prevCount.current!==56){setCelebrate(true);setTimeout(()=>setCelebrate(false),4500);}
    prevCount.current=state.daily.length;
  },[state.daily.length]);

  const toggleDaily=useCallback(id=>{
    setState(prev=>{
      const done=prev.daily.includes(id);
      const nd=done?prev.daily.filter(x=>x!==id):[...prev.daily,id];
      const wid='w'+id.slice(1);
      const nw={...prev.weekly};
      if(WEEKLY.find(t=>t.id===wid)){nw[wid]=done?Math.max(0,(nw[wid]||0)-1):Math.min(7,(nw[wid]||0)+1);}
      const nh=[...new Set([...prev.streakHist,TODAY])];
      const ns2=calcStreak(nh);
      const allDone=nd.length===56;
      const nf=allDone&&!prev.fullHist.includes(TODAY)?[...prev.fullHist,TODAY]:prev.fullHist;
      const ns={...prev,daily:nd,weekly:nw,streakHist:nh,streak:ns2,fullHist:nf};
      ns.badges=checkBadges(ns);return ns;
    });
  },[]);

  const toggleMonthly=useCallback(id=>{setState(prev=>{const d=prev.monthly.includes(id);const ns={...prev,monthly:d?prev.monthly.filter(x=>x!==id):[...prev.monthly,id]};ns.badges=checkBadges(ns);return ns;});},[]);
  const toggleLifetime=useCallback(id=>{setState(prev=>{const d=prev.lifetime.includes(id);const ns={...prev,lifetime:d?prev.lifetime.filter(x=>x!==id):[...prev.lifetime,id]};ns.badges=checkBadges(ns);return ns;});},[]);
  const toggleNotif=useCallback(id=>{setState(prev=>({...prev,notifs:prev.notifs.includes(id)?prev.notifs.filter(x=>x!==id):[...prev.notifs,id]}));},[]);
  const toggleTheme=useCallback(()=>{setState(prev=>({...prev,theme:prev.theme==='dark'?'light':'dark'}));},[]);

  const dPct=Math.round(state.daily.length/56*100);
  const wPassed=WEEKLY.filter(t=>(state.weekly[t.id]||0)>=5).length;
  const wPct=Math.round(wPassed/12*100);
  const mPct=Math.round(state.monthly.length/4*100);
  const stars=dPct>=90?5:dPct>=70?4:dPct>=50?3:dPct>=30?2:dPct>0?1:0;
  const pendingDaily=56-state.daily.length;

  return h('div',{id:'app',style:{display:'flex',flexDirection:'column',height:'100svh',background:'var(--bg)',maxWidth:430,margin:'0 auto',position:'relative',overflow:'hidden'}},
    h('a',{href:'#main',className:'skip-link'},'Skip to content'),
    h('main',{id:'main',style:{flex:1,overflow:'hidden',position:'relative'},role:'main'},
      tab==='home'&&h(HomeScreen,{key:'home',state,dPct,wPct,mPct,stars,dCount:state.daily.length,wCount:wPassed,onGoDaily:()=>setTab('daily')}),
      tab==='daily'&&h(DailyScreen,{key:'daily',state,onToggle:toggleDaily,onNotif:toggleNotif}),
      tab==='progress'&&h(ProgressScreen,{key:'progress',state,onMonthly:toggleMonthly,onLifetime:toggleLifetime}),
      tab==='awards'&&h(AwardsScreen,{key:'awards',state}),
      tab==='settings'&&h(SettingsScreen,{key:'settings',state,onTheme:toggleTheme,onNotif:toggleNotif})),

    h('nav',{className:'nav','aria-label':'Main navigation'},
      h('div',{className:'nav-inner'},
        TABS.map(({id,label,Icon})=>{
          const active=tab===id;
          const badge=id==='daily'&&pendingDaily>0?pendingDaily:0;
          return h('button',{key:id,type:'button',className:'nav-btn'+(active?' active':''),onClick:()=>setTab(id),
            'aria-label':label+(badge?' · '+badge+' remaining':''),'aria-current':active?'page':undefined},
            h('div',{style:{position:'relative',lineHeight:0}},
              active&&h('div',{className:'nav-pill'}),
              h(Icon),
              badge>0&&h('span',{className:'nav-badge'},badge>99?'99+':badge)),
            h('span',{style:{fontSize:10,fontWeight:active?700:500,marginTop:1}},label));
        }))),

    /* Confetti & Celebration */
    h(Confetti,{show:celebrate}),
    celebrate&&h('div',{className:'overlay',onClick:()=>setCelebrate(false),role:'dialog','aria-modal':true,'aria-labelledby':'celebrate-title'},
      h('div',{className:'modal-card celebrate-in',onClick:e=>e.stopPropagation(),style:{position:'relative'}},
        h('button',{type:'button',className:'modal-close',onClick:()=>setCelebrate(false),'aria-label':'Close celebration'},'×'),
        h('div',{style:{fontSize:52,marginBottom:10}},'🎉'),
        h('h3',{id:'celebrate-title',style:{fontSize:20,fontWeight:900,color:'var(--green)',marginBottom:6}},
          'All Daily Tasks Complete!'),
        h('p',{style:{fontSize:13,color:'var(--text3)',marginBottom:10}},'MashAllah! Truly a blessed day.'),
        h('p',{className:'ar',style:{fontSize:15,color:'var(--text3)'}},'جَزَاكَ اللّٰهُ خَيْرًا'),
        h('button',{type:'button',className:'cta-btn',style:{marginTop:16},onClick:()=>setCelebrate(false)},'Alhamdulillah'))));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
