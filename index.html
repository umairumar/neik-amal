// ─── STATE MANAGEMENT ───────────────────────────────────────────────────────
const TODAY = new Date().toISOString().split('T')[0];
const THIS_MONTH = `${new Date().getFullYear()}-${new Date().getMonth()}`;

function getWeekKey() {
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-d.getDay());
  return d.toISOString().split('T')[0];
}

function calcStreak(hist) {
  if(!hist.length) return 0;
  const sorted=[...new Set(hist)].sort().reverse();
  let streak=0, cur=new Date(TODAY);
  for(const dt of sorted){
    const d=new Date(dt);
    const diff=Math.round((cur-d)/(864e5));
    if(diff<=1){streak++;cur=d;}else break;
  }
  return streak;
}

function loadState() {
  try {
    const raw=localStorage.getItem('neik-amal-v2');
    const def={
      daily:[],weekly:{},monthly:[],lifetime:[],
      streak:0,streakHist:[],fullDayHist:[],
      badges:[],notifs:[],theme:'dark',
      lastDay:TODAY,lastWeek:getWeekKey(),lastMonth:THIS_MONTH,
    };
    if(!raw) return def;
    const s=JSON.parse(raw);
    if(s.lastDay!==TODAY){s.daily=[];s.lastDay=TODAY;}
    if(s.lastWeek!==getWeekKey()){s.weekly={};s.lastWeek=getWeekKey();}
    if(s.lastMonth!==THIS_MONTH){s.monthly=[];s.lastMonth=THIS_MONTH;}
    s.streak=calcStreak(s.streakHist||[]);
    return {...def,...s};
  } catch{return{daily:[],weekly:{},monthly:[],lifetime:[],streak:0,streakHist:[],fullDayHist:[],badges:[],notifs:[],theme:'dark',lastDay:TODAY,lastWeek:getWeekKey(),lastMonth:THIS_MONTH};}
}

function Icon({name, size=18, style={}}) {
  const ref = useRef(null);
  useEffect(()=>{
    if(ref.current && window.lucide){
      ref.current.innerHTML='';
      const svg = lucide[name] ? lucide.createIcons({nameAttr:'data-lucide'}) : null;
      // fallback: create SVG manually via lucide
      const iconData = lucide[name];
      if(iconData){
        const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
        svgEl.setAttribute('width', size);
        svgEl.setAttribute('height', size);
        svgEl.setAttribute('viewBox','0 0 24 24');
        svgEl.setAttribute('fill','none');
        svgEl.setAttribute('stroke','currentColor');
        svgEl.setAttribute('stroke-width','2');
        svgEl.setAttribute('stroke-linecap','round');
        svgEl.setAttribute('stroke-linejoin','round');
        const [attrs, children] = iconData;
        children.forEach(([tag, tagAttrs])=>{
          const el = document.createElementNS('http://www.w3.org/2000/svg',tag);
          Object.entries(tagAttrs||{}).forEach(([k,v])=>el.setAttribute(k,v));
          svgEl.appendChild(el);
        });
        ref.current.appendChild(svgEl);
      }
    }
  },[name,size]);
  return h('span',{ref, style:{display:'inline-flex',alignItems:'center',...style}});
}

// ─── ACTIVITY RINGS ──────────────────────────────────────────────────────────
function ActivityRings({daily,weekly,monthly}) {
  const [anim, setAnim] = useState(false);
  useEffect(()=>{const t=setTimeout(()=>setAnim(true),100);return()=>clearTimeout(t);},[]);

  function ring(pct, r, color, track) {
    const circ = 2*Math.PI*r;
    const offset = anim ? circ - (pct/100)*circ : circ;
    return h('g',{key:r},
      h('circle',{cx:90,cy:90,r,fill:'none',stroke:track,strokeWidth:9}),
      h('circle',{cx:90,cy:90,r,fill:'none',stroke:color,strokeWidth:9,
        strokeLinecap:'round',strokeDasharray:circ,strokeDashoffset:offset,
        style:{transformOrigin:'90px 90px',transform:'rotate(-90deg)',
          transition:'stroke-dashoffset 1.3s cubic-bezier(0.4,0,0.2,1)',
          filter:`drop-shadow(0 0 5px ${color}88)`}}));
  }

  return h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center'}},
    h('svg',{width:180,height:180,viewBox:'0 0 180 180'},
      ring(monthly,80,'#10b981','rgba(16,185,129,.12)'),
      ring(weekly,63,'#f59e0b','rgba(245,158,11,.12)'),
      ring(daily,46,'#22c55e','rgba(34,197,94,.12)'),
      h('text',{x:90,y:84,textAnchor:'middle',fill:'#888',fontSize:10},  'Daily'),
      h('text',{x:90,y:101,textAnchor:'middle',fill:'#22c55e',fontSize:22,fontWeight:'bold'},daily+'%')),
    h('div',{style:{display:'flex',gap:16,marginTop:8}},
      ...[['#22c55e','Daily'],['#f59e0b','Weekly'],['#10b981','Monthly']].map(([c,l])=>
        h('div',{key:l,style:{display:'flex',alignItems:'center',gap:5}},
          h('div',{style:{width:8,height:8,borderRadius:'50%',background:c,boxShadow:`0 0 5px ${c}88`}}),
          h('span',{style:{fontSize:10,color:'#888'}},l)))));
}

// ─── TASK CARD ───────────────────────────────────────────────────────────────
function TaskCard({task,done,notifOn,onToggle,onToggleNotif,showNotif,idx}) {
  const [anim,setAnim]=useState(false);
  const handleToggle=()=>{
    if(!done){setAnim(true);setTimeout(()=>setAnim(false),400);}
    onToggle(task.id);
  };

  return h('div',{
    className:'task-card'+(done?' task-done-card':''),
    style:{display:'flex',alignItems:'flex-start',gap:12,padding:'12px 14px',
      borderRadius:12,border:'1px solid',borderColor:done?'rgba(34,197,94,.2)':'hsl(var(--border))',
      background:done?'rgba(34,197,94,.06)':'hsl(var(--card))',
      marginBottom:8,transform:anim?'scale(1.02)':'scale(1)',
      transition:'all 0.25s ease',cursor:'pointer'},
    onClick:handleToggle},
    h('div',{style:{width:22,height:22,borderRadius:'50%',border:'2px solid',
      borderColor:done?'#22c55e':'hsl(var(--border))',flexShrink:0,marginTop:2,
      display:'flex',alignItems:'center',justifyContent:'center',
      background:done?'#22c55e':'transparent',
      boxShadow:done?'0 0 10px rgba(34,197,94,.4)':'none',
      transition:'all 0.3s ease'}},
      done&&h('span',{className:'check-pop'},h(icons.Check))),
    h('div',{style:{flex:1,minWidth:0}},
      h('div',{style:{display:'flex',alignItems:'center',gap:6,marginBottom:2}},
        h('span',{style:{fontSize:13}},task.icon),
        h('span',{style:{fontSize:10,color:'#666',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em'}},task.group),
        h('span',{style:{fontSize:10,color:'#555'}},'#'+task.n)),
      h('p',{style:{fontSize:13,lineHeight:1.4,color:done?'#666':'hsl(var(--foreground))',
        textDecoration:done?'line-through':'none',textDecorationColor:'rgba(34,197,94,.5)',
        transition:'all 0.3s'}},task.text)),
    showNotif&&h('button',{
      onClick:e=>{e.stopPropagation();onToggleNotif(task.id);},
      style:{flexShrink:0,padding:4,borderRadius:8,border:'none',cursor:'pointer',
        background:notifOn?'rgba(245,158,11,.15)':'transparent',
        color:notifOn?'#f59e0b':'#888'}},
      notifOn?h(icons.Bell):h(icons.BellOff)));
}

// ─── HOME SCREEN ─────────────────────────────────────────────────────────────
function HomeScreen({state,dailyPct,weeklyPct,monthlyPct,stars,dailyCount,weeklyCount}) {
  const msg = useMemo(()=>{
    const dy=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/864e5);
    return MOTIVATIONAL[dy%MOTIVATIONAL.length];
  },[]);
  const today=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const streak=state.streak;

  return h('div',{style:{padding:'20px 16px',paddingBottom:90,overflowY:'auto'}},
    // Header
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16}},
      h('div',{},
        h('p',{style:{fontSize:11,color:'#888',fontWeight:600}},today),
        h('h1',{style:{fontSize:26,fontWeight:800,margin:'2px 0 0'},className:'shimmer'},'نیک عمل'),
        h('p',{style:{fontSize:12,color:'#888'}}, 'Neik-Amal · Pious Deeds')),
      streak>0&&h('div',{className:'streak-pulse',style:{display:'flex',alignItems:'center',gap:6,
        background:'rgba(249,168,37,.12)',border:'1px solid rgba(249,168,37,.35)',
        borderRadius:20,padding:'6px 12px',color:'#f59e0b'}},
        h(icons.Flame),
        h('span',{style:{fontSize:14,fontWeight:700}},streak),
        h('span',{style:{fontSize:11,color:'#d97706'}},'day streak'))),

    // Rings card
    h('div',{className:'geo-bg',style:{background:'hsl(var(--card))',border:'1px solid hsl(var(--border))',
      borderRadius:20,padding:'20px 20px 16px',textAlign:'center',marginBottom:16}},
      h('p',{style:{fontSize:10,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:12}},"Today's Activity"),
      h(ActivityRings,{daily:dailyPct,weekly:weeklyPct,monthly:monthlyPct}),
      h('div',{style:{display:'flex',justifyContent:'center',gap:4,marginTop:14}},
        ...[1,2,3,4,5].map(s=>h('span',{key:s,className:s<=stars?'star-pop':'',
          style:{fontSize:18,filter:s<=stars?'drop-shadow(0 0 4px #f59e0b88)':'none',
            color:s<=stars?'#f59e0b':'#444',animationDelay:(s-1)*0.08+'s'}},s<=stars?'★':'☆'))),
      h('p',{style:{fontSize:11,color:'#888',marginTop:4}},
        stars===5?'Exceptional — MashAllah! 🌟':
        stars===4?'Excellent work! Keep going':
        stars===3?'Good progress, keep striving':
        stars>=1?'Keep going! Every deed counts 🌱':
        'Begin your pious journey today')),

    // Stats
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:16}},
      ...[
        {icon:'📅',val:`${dailyCount}/56`,lbl:'Today',c:'#22c55e'},
        {icon:'📊',val:`${weeklyCount}/12`,lbl:'Weekly',c:'#f59e0b'},
        {icon:'🏅',val:`${state.badges.length}`,lbl:'Badges',c:'#10b981'},
      ].map(({icon,val,lbl,c})=>h('div',{key:lbl,style:{background:'hsl(var(--card))',border:'1px solid hsl(var(--border))',
        borderRadius:14,padding:'12px 8px',textAlign:'center'}},
        h('div',{style:{fontSize:16,marginBottom:2}},icon),
        h('div',{style:{fontSize:16,fontWeight:800,color:c}},val),
        h('div',{style:{fontSize:10,color:'#888'}},lbl)))),

    // Quote
    h('div',{style:{background:'hsl(var(--card))',border:'1px solid hsl(var(--border))',
      borderRadius:18,padding:'16px',position:'relative',overflow:'hidden',marginBottom:16}},
      h('div',{style:{position:'absolute',top:0,left:0,width:3,height:'100%',
        background:'linear-gradient(to bottom,#22c55e,#10b981)',borderRadius:'12px 0 0 12px'}}),
      h('div',{style:{paddingLeft:12}},
        h('p',{style:{fontSize:10,fontWeight:700,color:'#22c55e',textTransform:'uppercase',
          letterSpacing:'0.08em',marginBottom:8}},"Today's Reminder"),
        h('p',{style:{fontSize:13,lineHeight:1.5,fontWeight:500}},msg.text),
        h('p',{style:{fontSize:12,color:'#888',marginTop:8,textAlign:'right',fontFamily:'Georgia,serif',direction:'rtl'}},msg.ar))),

    // Nudge / completion
    dailyPct===100
      ? h('div',{style:{background:'rgba(34,197,94,.1)',border:'1px solid rgba(34,197,94,.3)',
          borderRadius:16,padding:'16px',textAlign:'center'}},
          h('div',{style:{fontSize:32,marginBottom:4}},'🎉'),
          h('p',{style:{fontWeight:700,color:'#22c55e',fontSize:14}},'All Daily Tasks Complete!'),
          h('p',{style:{fontSize:12,color:'#888',marginTop:4}},'MashAllah! What a blessed day. جَزَاكَ اللّٰهُ خَيْرًا'))

            display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:18}},'📈'),
          h('div',{},
            h('p',{style:{fontSize:13,fontWeight:600}},(56-dailyCount)+' task'+(56-dailyCount!==1?'s':'')+' remaining today'),
            h('p',{style:{fontSize:11,color:'#888'}},
              dailyPct>=50?'More than halfway there! 💪':'Every deed counts. Start now 🌱'))));
}

// ─── DAILY SCREEN ─────────────────────────────────────────────────────────────
const GROUPS=['All','Salah','Quran','Dhikr','Character','Sunnah','Dawah','Knowledge','Organisational','Tawbah','Self-Accountability','Intentions'];

function DailyScreen({state,onToggle,onToggleNotif}) {
  const [search,setSearch]=useState('');
  const [grp,setGrp]=useState('All');
  const [pending,setPending]=useState(false);
  const done=state.daily;
  const filtered=DAILY_TASKS.filter(t=>{
    const mg=grp==='All'||t.group===grp;
    const ms=!search||t.text.toLowerCase().includes(search.toLowerCase());
    const mp=!pending||!done.includes(t.id);
    return mg&&ms&&mp;
  });
  const pct=Math.round((done.length/56)*100);

  return h('div',{style:{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}},
    h('div',{style:{padding:'20px 16px 12px',position:'sticky',top:0,zIndex:10,
      background:'hsl(var(--background))',borderBottom:'1px solid hsl(var(--border))'}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}},
        h('div',{},
          h('h2',{style:{fontSize:18,fontWeight:700}},'Daily Deeds'),
          h('p',{style:{fontSize:11,color:'#888'}},done.length+' of 56 completed')),
        h('span',{style:{fontSize:24,fontWeight:800,color:'#22c55e'}},pct+'%')),
      h('div',{style:{height:5,background:'hsl(var(--muted))',borderRadius:3,overflow:'hidden',marginBottom:10}},
        h('div',{style:{height:'100%',borderRadius:3,width:pct+'%',
          background:'linear-gradient(90deg,#22c55e,#10b981)',
          boxShadow:'0 0 8px rgba(34,197,94,.5)',transition:'width 0.8s ease'}})),
      h('div',{style:{position:'relative',marginBottom:10}},
        h('span',{style:{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'#888'}},h(icons.Search)),
        h('input',{value:search,onChange:e=>setSearch(e.target.value),placeholder:'Search tasks...',
          style:{width:'100%',paddingLeft:32,paddingRight:12,paddingTop:8,paddingBottom:8,
            fontSize:13,background:'hsl(var(--muted))',border:'1px solid hsl(var(--border))',
            borderRadius:10,outline:'none',color:'hsl(var(--foreground))'}})),
      h('div',{style:{display:'flex',gap:8,overflowX:'auto',paddingBottom:4}},
        h('button',{onClick:()=>setPending(!pending),
          style:{flexShrink:0,padding:'4px 10px',borderRadius:20,border:'1px solid',fontSize:11,fontWeight:600,cursor:'pointer',
            borderColor:pending?'rgba(245,158,11,.4)':'hsl(var(--border))',
            background:pending?'rgba(245,158,11,.12)':'transparent',
            color:pending?'#f59e0b':'#888'}},'Pending'),
        ...GROUPS.slice(0,8).map(g=>h('button',{key:g,onClick:()=>setGrp(g),
          style:{flexShrink:0,padding:'4px 10px',borderRadius:20,border:'1px solid',fontSize:11,fontWeight:600,cursor:'pointer',
            borderColor:grp===g?'rgba(34,197,94,.4)':'hsl(var(--border))',
            background:grp===g?'rgba(34,197,94,.12)':'transparent',
            color:grp===g?'#22c55e':'#888'}},g)))),
    h('div',{style:{flex:1,overflowY:'auto',padding:'12px 16px',paddingBottom:90}},
      filtered.length===0
        ? h('div',{style:{textAlign:'center',padding:'60px 0',color:'#888'}},
            h('div',{style:{fontSize:40,marginBottom:8}},'✅'),
            h('p',{style:{fontSize:13}},pending?'All tasks in this category complete! 🎉':'No tasks found'))
        : filtered.map((t,i)=>h(TaskCard,{key:t.id,task:t,done:done.includes(t.id),
            notifOn:state.notifs.includes(t.id),onToggle,onToggleNotif,showNotif:true,idx:i}))));
}

// ─── PROGRESS SCREEN ──────────────────────────────────────────────────────────
function ProgressScreen({state,onToggleMonthly,onToggleLifetime}) {
  return h('div',{style:{padding:'20px 16px',paddingBottom:90,overflowY:'auto'}},
    // Weekly
    h('div',{style:{marginBottom:24}},
      h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:12}},
        h('div',{style:{width:30,height:30,borderRadius:'50%',background:'rgba(245,158,11,.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15}},'⏳'),
        h('div',{},h('h3',{style:{fontSize:14,fontWeight:700}},'Weekly Goals'),
          h('p',{style:{fontSize:11,color:'#888'}},WEEKLY_TASKS.filter(t=>(state.weekly[t.id]||0)>=5).length+'/12 tasks passing (5+ days)'))),
      h('div',{},WEEKLY_TASKS.map(t=>{
        const cnt=state.weekly[t.id]||0, passed=cnt>=5;
        return h('div',{key:t.id,style:{borderRadius:14,border:'1px solid',
          borderColor:passed?'rgba(245,158,11,.25)':'hsl(var(--border))',
          background:passed?'rgba(245,158,11,.07)':'hsl(var(--card))',
          padding:'12px 14px',marginBottom:8}},
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}},
            h('div',{style:{flex:1}},
              h('div',{style:{display:'flex',gap:6,alignItems:'center',marginBottom:3}},
                h('span',null,t.icon),
                h('span',{style:{fontSize:10,color:'#888',textTransform:'uppercase',fontWeight:600}},t.group),
                passed&&h('span',{style:{fontSize:9,background:'rgba(245,158,11,.2)',color:'#f59e0b',padding:'1px 6px',borderRadius:10,fontWeight:700}},'PASSED ✓')),
              h('p',{style:{fontSize:12,lineHeight:1.4}},t.text)),
            h('span',{style:{fontSize:13,fontWeight:700,color:passed?'#f59e0b':'#888',marginLeft:8}},cnt+'/7')),
          h('div',{style:{display:'flex',gap:3}},
            ...[0,1,2,3,4,5,6].map(i=>h('div',{key:i,style:{flex:1,height:5,borderRadius:3,
              background:i<cnt?(i<5?'#f59e0b':'#22c55e'):'hsl(var(--muted))',transition:'background 0.4s'}}))),
          h('p',{style:{fontSize:10,color:'#888',marginTop:4}},
            passed?'Goal met for this week!':`Need ${Math.max(0,5-cnt)} more day${5-cnt!==1?'s':''} to pass`));
      }))),

    // Monthly
    h('div',{style:{marginBottom:24}},
      h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:12}},
        h('div',{style:{width:30,height:30,borderRadius:'50%',background:'rgba(16,185,129,.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15}},'📅'),
        h('div',{},h('h3',{style:{fontSize:14,fontWeight:700}},'Monthly Tasks'),

// ─── AWARDS SCREEN ───────────────────────────────────────────────────────────

  const earned=state.badges;
  const total=BADGES.length;
  const pct=Math.round((earned.length/total)*100);

  const byType={streak:[],completion:[],category:[],special:[]};
  BADGES.forEach(b=>byType[b.type].push(b));

  return h('div',{style:{padding:'20px 16px',paddingBottom:90,overflowY:'auto'}},
    h('div',{className:'geo-bg',style:{background:'hsl(var(--card))',border:'1px solid hsl(var(--border))',
      borderRadius:20,padding:'20px',textAlign:'center',marginBottom:20}},
      h('div',{style:{fontSize:44,marginBottom:8}},'🏆'),
      h('h2',{style:{fontSize:18,fontWeight:700,marginBottom:4}},'Trophy Room'),
      h('p',{style:{fontSize:13,color:'#888'}},
        h('span',{style:{color:'#f59e0b',fontWeight:700}},earned.length),' of ',total,' badges earned'),
      h('div',{style:{height:8,background:'hsl(var(--muted))',borderRadius:4,overflow:'hidden',margin:'12px 16px 0'}},
        h('div',{style:{height:'100%',borderRadius:4,width:pct+'%',
          background:'linear-gradient(90deg,#f59e0b,#fbbf24)',
          boxShadow:'0 0 8px rgba(245,158,11,.5)',transition:'width 1s ease'}}))),

    ...[['🔥 Streak Awards','streak'],['🌟 Completion','completion'],['🎯 Category','category'],['✨ Special','special']]
      .map(([label,type])=>h('div',{key:type,style:{marginBottom:24}},
        h('h3',{style:{fontSize:13,fontWeight:700,marginBottom:10}},label),
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
          ...byType[type].map(badge=>{
            const isEarned=earned.includes(badge.id);
            return h('div',{key:badge.id,className:isEarned?'badge-glow badge-appear':'badge-locked',
              style:{display:'flex',flexDirection:'column',alignItems:'center',gap:8,padding:'16px 12px',
                borderRadius:18,border:'1px solid',
                borderColor:isEarned?badge.color+'55':'hsl(var(--border))',
                background:'hsl(var(--card))',transition:'all 0.4s'}},
              h('div',{style:{fontSize:32,filter:isEarned?`drop-shadow(0 0 8px ${badge.color}99)`:'none'}},
                isEarned?badge.icon:h(icons.Lock)),
              h('div',{style:{textAlign:'center'}},
                h('p',{style:{fontSize:11,fontWeight:700,color:isEarned?'hsl(var(--foreground))':'#666'}},badge.name),
                h('p',{style:{fontSize:10,color:'#888',marginTop:2}},badge.desc)),
              isEarned&&h('div',{style:{fontSize:9,fontWeight:700,padding:'2px 8px',borderRadius:10,color:'white',background:badge.color}},'Earned ✓'));
          })))),

    // Next to unlock
    h('div',{style:{background:'hsl(var(--card))',border:'1px solid hsl(var(--border))',
      borderRadius:14,padding:'14px',marginTop:4}},
      h('p',{style:{fontSize:10,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:8}},'Next to Unlock'),
      !earned.includes('streak7')&&state.streak>0
        &&h('div',{style:{fontSize:12,color:'hsl(var(--foreground))',marginBottom:4,display:'flex',gap:6}},
          h('span',null,'🥉'),h('span',null,'Week Warrior — '+(7-state.streak)+' more streak day'+(7-state.streak!==1?'s':''))),
      !earned.includes('daily_all')
        &&h('div',{style:{fontSize:12,color:'hsl(var(--foreground))',marginBottom:4,display:'flex',gap:6}},
          h('span',null,'⭐'),h('span',null,'Pious Day — Complete all 56 tasks in one day')),
      !earned.includes('monthly_all')
        &&h('div',{style:{fontSize:12,color:'hsl(var(--foreground))',marginBottom:4,display:'flex',gap:6}},
          h('span',null,'🌟'),h('span',null,'Monthly Devotee — Complete all 4 monthly tasks')),
      earned.length===total&&h('p',{style:{fontSize:13,fontWeight:700,color:'#f59e0b',textAlign:'center'}},'MashAllah! All badges earned! 🌟')));
}

    const allOn=tasks.every(t=>state.notifs.includes(t.id));

  return h('div',{style:{padding:'20px 16px',paddingBottom:90,overflowY:'auto'}},
    h('h2',{style:{fontSize:18,fontWeight:700,marginBottom:16}},'Settings'),

    // Theme

    h('div',{style:{background:'hsl(var(--card))',border:'1px solid hsl(var(--border))',borderRadius:14,marginBottom:20}},
      h('button',{onClick:onToggleTheme,
        style:{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',
          padding:'14px 16px',background:'transparent',border:'none',cursor:'pointer',color:'hsl(var(--foreground))'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:10}},
          h('span',{style:{fontSize:14}},state.theme==='dark'?'🌙':'☀️'),
          h('span',{style:{fontSize:13,fontWeight:600}},state.theme==='dark'?'Dark Mode':'Light Mode')),
        h('div',{style:{width:44,height:24,borderRadius:12,background:state.theme==='dark'?'#3b82f6':'#f59e0b',
          position:'relative',transition:'background 0.3s'}},
          h('div',{style:{position:'absolute',top:3,width:18,height:18,background:'white',borderRadius:'50%',
            left:state.theme==='dark'?22:3,transition:'left 0.3s',boxShadow:'0 1px 4px rgba(0,0,0,.3)'}})
        ))),

    // Stats
    h('p',{style:{fontSize:10,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:8}},'Your Progress'),
    h('div',{style:{background:'hsl(var(--card))',border:'1px solid hsl(var(--border))',borderRadius:14,
      padding:'16px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:20}},
      h('div',{style:{textAlign:'center'}},
        h('p',{style:{fontSize:24,fontWeight:800,color:'#f59e0b'}},'🔥 '+state.streak),
        h('p',{style:{fontSize:11,color:'#888'}},'Day Streak')),
      h('div',{style:{textAlign:'center'}},
        h('p',{style:{fontSize:24,fontWeight:800,color:'#22c55e'}},state.daily.length),
        h('p',{style:{fontSize:11,color:'#888'}},'Tasks Today'))),

    // Notifications
    h('p',{style:{fontSize:10,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:8}},'Notifications by Category'),
    h('div',{style:{background:'hsl(var(--card))',border:'1px solid hsl(var(--border))',borderRadius:14,overflow:'hidden',marginBottom:20}},
      Object.entries(byGroup).map(([grp,tasks],i)=>{
        const allOn=tasks.every(t=>state.notifs.includes(t.id));
        const someOn=tasks.some(t=>state.notifs.includes(t.id));
        return h('div',{key:grp,style:{display:'flex',alignItems:'center',justifyContent:'space-between',
          padding:'12px 16px',borderTop:i>0?'1px solid hsl(var(--border))':'none'}},
          h('div',{},
            h('p',{style:{fontSize:13,fontWeight:600}},grp),

          h('button',{onClick:()=>toggleGroup(grp),

              background:allOn?'rgba(34,197,94,.15)':someOn?'rgba(245,158,11,.15)':'transparent',
              color:allOn?'#22c55e':someOn?'#f59e0b':'#888'}},

      h('p',{style:{fontSize:13,fontWeight:700,marginBottom:6}},'Neik-Amal نیک عمل'),
      h('p',{style:{fontSize:12,color:'#888',lineHeight:1.6}},
        'A daily pious deeds tracker inspired by the Madani environment of Dawat-e-Islami. Based on the 56 daily tasks, weekly goals, monthly objectives and lifetime achievements.'),
      h('p',{style:{fontSize:13,color:'#888',marginTop:10,textAlign:'right',fontFamily:'Georgia,serif',direction:'rtl'}},
        'بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ')),

// ─── CONFETTI ─────────────────────────────────────────────────────────────────
function Confetti({show}) {
  const ref=useRef(null);
  useEffect(()=>{
    if(!show||!ref.current)return;
    const colors=['#22c55e','#f59e0b','#10b981','#fbbf24','#34d399','#86efac'];
    const frags=[];
    for(let i=0;i<28;i++){
      const el=document.createElement('div');
      el.className='conf-p';
      const angle=(i/28)*360, dist=70+Math.random()*90;
      el.style.cssText=`left:50%;top:40%;background:${colors[i%colors.length]};--tx:${Math.cos(angle*Math.PI/180)*dist}px;--ty:${Math.sin(angle*Math.PI/180)*dist-50}px;--rot:${Math.random()*720-360}deg;animation-delay:${Math.random()*0.15}s;width:${4+Math.random()*7}px;height:${4+Math.random()*7}px;border-radius:${Math.random()>.5?'50%':'3px'}`;
      ref.current.appendChild(el);frags.push(el);
    }
    const t=setTimeout(()=>frags.forEach(f=>f.remove()),1800);
    return()=>{clearTimeout(t);frags.forEach(f=>f.remove());};
  },[show]);
  return h('div',{ref,style:{position:'fixed',inset:0,pointerEvents:'none',zIndex:9999}});
}

// ─── MAIN APP ────────────────────────────────────────────────────────────────
function App() {
  const [state,setState]=useState(loadState);
  const [tab,setTab]=useState('home');
  const [showCelebrate,setShowCelebrate]=useState(false);
  const prevCount=useRef(state.daily.length);

  // Apply theme
  useEffect(()=>{
    document.documentElement.classList.toggle('dark',state.theme==='dark');
    localStorage.setItem('neik-amal-v2',JSON.stringify(state));
  },[state]);

  // Watch for all-complete
  useEffect(()=>{
    if(state.daily.length===56&&prevCount.current!==56){
      setShowCelebrate(true);setTimeout(()=>setShowCelebrate(false),4000);
    }
    prevCount.current=state.daily.length;
  },[state.daily.length]);

  function checkBadges(s) {
    const e=[...s.badges];
    const add=id=>{if(!e.includes(id))e.push(id);};
    if(s.daily.length>0)add('first');
    if(s.daily.length===56)add('daily_all');
    if(s.monthly.length===4)add('monthly_all');
    if(s.lifetime.includes('l71'))add('scholar');
    if(s.streak>=7)add('streak7');
    if(s.streak>=30)add('streak30');
    if(s.streak>=90)add('streak90');
    if(s.streak>=365)add('streak365');
    if(s.fullDayHist&&s.fullDayHist.length>=7)add('perfect_week');
    const wp=WEEKLY_TASKS.filter(t=>(s.weekly[t.id]||0)>=5).length;
    if(wp===12)add('weekly_all');
    return e;
  }

  const toggleDaily=useCallback(id=>{
    setState(prev=>{
      const isDone=prev.daily.includes(id);
      const newDaily=isDone?prev.daily.filter(x=>x!==id):[...prev.daily,id];
      const wid='w'+id.slice(1);
      const wt=WEEKLY_TASKS.find(t=>t.id===wid);
      const newWeekly={...prev.weekly};
      if(wt){
        if(!isDone)newWeekly[wid]=Math.min(7,(newWeekly[wid]||0)+1);
        else newWeekly[wid]=Math.max(0,(newWeekly[wid]||0)-1);
      }
      const newHist=[...new Set([...prev.streakHist,TODAY])];
      const newStreak=calcStreak(newHist);
      const allDone=newDaily.length===56;
      const newFull=allDone&&!prev.fullDayHist.includes(TODAY)?[...prev.fullDayHist,TODAY]:prev.fullDayHist;
      const ns={...prev,daily:newDaily,weekly:newWeekly,streakHist:newHist,streak:newStreak,fullDayHist:newFull};
      ns.badges=checkBadges(ns);
      return ns;
    });
  },[]);

  const toggleMonthly=useCallback(id=>{
    setState(prev=>{
      const done=prev.monthly.includes(id);
      const ns={...prev,monthly:done?prev.monthly.filter(x=>x!==id):[...prev.monthly,id]};
      ns.badges=checkBadges(ns);return ns;
    });
  },[]);

  const toggleLifetime=useCallback(id=>{
    setState(prev=>{
      const done=prev.lifetime.includes(id);
      const ns={...prev,lifetime:done?prev.lifetime.filter(x=>x!==id):[...prev.lifetime,id]};
      ns.badges=checkBadges(ns);return ns;
    });
  },[]);

  const toggleNotif=useCallback(id=>{
    setState(prev=>({...prev,notifs:prev.notifs.includes(id)?prev.notifs.filter(x=>x!==id):[...prev.notifs,id]}));
  },[]);

  const toggleTheme=useCallback(()=>{
    setState(prev=>({...prev,theme:prev.theme==='dark'?'light':'dark'}));
  },[]);

  const dailyPct=Math.round((state.daily.length/56)*100);
  const weeklyPassed=WEEKLY_TASKS.filter(t=>(state.weekly[t.id]||0)>=5).length;
  const weeklyPct=Math.round((weeklyPassed/12)*100);
  const monthlyPct=Math.round((state.monthly.length/4)*100);
  const stars=dailyPct>=90?5:dailyPct>=70?4:dailyPct>=50?3:dailyPct>=30?2:dailyPct>0?1:0;

  const navItems=[
    {id:'home',label:'Home',icon:h(icons.Home)},
    {id:'daily',label:'Daily',icon:h(icons.Sun)},
    {id:'progress',label:'Progress',icon:h(icons.BarChart)},
    {id:'awards',label:'Awards',icon:h(icons.Trophy)},
    {id:'settings',label:'Settings',icon:h(icons.Settings)},
  ];

  return h('div',{style:{display:'flex',flexDirection:'column',minHeight:'100svh',
    background:'hsl(var(--background))',maxWidth:430,margin:'0 auto',position:'relative'}},

    // Screen content
    h('main',{style:{flex:1,overflow:'hidden',position:'relative'}},
      tab==='home'&&h('div',{style:{height:'100%',overflowY:'auto'}},
        h(HomeScreen,{state,dailyPct,weeklyPct,monthlyPct,stars,
          dailyCount:state.daily.length,weeklyCount:weeklyPassed})),
      tab==='daily'&&h('div',{style:{height:'100%',display:'flex',flexDirection:'column',overflow:'hidden'}},
        h(DailyScreen,{state,onToggle:toggleDaily,onToggleNotif:toggleNotif})),
      tab==='progress'&&h('div',{style:{height:'100%',overflowY:'auto'}},
        h(ProgressScreen,{state,onToggleMonthly:toggleMonthly,onToggleLifetime:toggleLifetime})),
      tab==='awards'&&h('div',{style:{height:'100%',overflowY:'auto'}},
        h(AwardsScreen,{state})),
      tab==='settings'&&h('div',{style:{height:'100%',overflowY:'auto'}},
        h(SettingsScreen,{state,onToggleTheme:toggleTheme,onToggleNotif:toggleNotif}))),

    // Bottom nav
    h('nav',{style:{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',
      width:'100%',maxWidth:430,background:'hsl(var(--card))',
      borderTop:'1px solid hsl(var(--border))',
      backdropFilter:'blur(12px)',zIndex:50}},
      h('div',{style:{display:'flex',justifyContent:'space-around',padding:'8px 8px',
        paddingBottom:'max(8px,env(safe-area-inset-bottom))'}},
        navItems.map(({id,label,icon})=>{
          const active=tab===id;
          return h('button',{key:id,className:'nav-btn'+(active?' active':''),
            onClick:()=>setTab(id),
            style:{display:'flex',flexDirection:'column',alignItems:'center',gap:3,
              padding:'6px 10px',borderRadius:12,border:'none',cursor:'pointer',
              background:'transparent',
              color:active?'#22c55e':'hsl(var(--muted-foreground))',
              transform:active?'scale(1.1)':'scale(1)',transition:'all 0.2s'}},
            h('div',{style:{position:'relative'}},
              icon,
              active&&h('div',{style:{position:'absolute',bottom:-3,left:'50%',transform:'translateX(-50%)',
                width:4,height:4,borderRadius:'50%',background:'#22c55e'}})),
            h('span',{style:{fontSize:10,fontWeight:active?700:500}},label));
        }))),

    // Celebration
    h(Confetti,{show:showCelebrate}),
    showCelebrate&&h('div',{className:'overlay',onClick:()=>setShowCelebrate(false)},
      h('div',{className:'modal celebrate'},
        h('div',{style:{fontSize:48,marginBottom:8}},'🎉'),
        h('h3',{style:{fontSize:18,fontWeight:800,color:'#22c55e',marginBottom:4}},'All Daily Tasks Complete!'),
        h('p',{style:{fontSize:13,color:'#888',marginBottom:4}},'MashAllah! Truly a blessed day.'),
        h('p',{style:{fontSize:14,fontFamily:'Georgia,serif',direction:'rtl',color:'#888'}},'جَزَاكَ اللّٰهُ خَيْرًا'))));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
